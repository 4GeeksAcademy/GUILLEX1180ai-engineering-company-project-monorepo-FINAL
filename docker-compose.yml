# =============================================================================
# TrackFlow — Docker Compose (orquestación local)
#
# Arranque (desarrollo con hot-reload):
#   docker compose up --build
#
# Arranque (producción):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# URLs locales:
#   - Website     → http://localhost:3000
#   - Backoffice  → http://localhost:3001
#   - Application → http://localhost:3002
#   - API         → http://localhost:8001
#   - API Docs    → http://localhost:8001/api/v1/docs
# =============================================================================

services:

  # ────────────────────────────────────────────────────────────────
  # Website — Sitio corporativo estático
  # ────────────────────────────────────────────────────────────────
  website:
    image: node:22-alpine
    container_name: trackflow-website
    ports:
      - "3000:3000"
    working_dir: /app/website
    volumes:
      - ./uis/website:/app/website
    command: npx serve -l 3000 .
    networks:
      - trackflow-network
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # Backoffice — Panel interno (Next.js 15)
  # ────────────────────────────────────────────────────────────────
  backoffice:
    build:
      context: .
      dockerfile: uis/backoffice/Dockerfile
    container_name: trackflow-backoffice
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:8001/api/v1
      - BACKEND_HOST=backend
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - trackflow-network
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # Application — App de proveedores (Next.js 15)
  # ────────────────────────────────────────────────────────────────
  application:
    build:
      context: .
      dockerfile: uis/application/Dockerfile
    container_name: trackflow-application
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:8001/api/v1
      - BACKEND_HOST=backend
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - trackflow-network
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────
  # Backend — API FastAPI (Uvicorn + hot-reload)
  # ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: trackflow-backend
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - FRONTEND_URL=http://localhost:3001
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:8080
    env_file:
      - .env
    networks:
      - trackflow-network
    restart: unless-stopped

# ────────────────────────────────────────────────────────────────
# Red compartida con nombre explícito
# ────────────────────────────────────────────────────────────────
networks:
  trackflow-network:
    name: trackflow-network
    driver: bridge