name: CI — Tests API + Build Frontend

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  api-tests:
    name: Backend API tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ejecutar tests (incluye 12 criterios + 3 extensiones auth)
        run: pytest tests/ -q --disable-warnings
        env:
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production

  frontend-build:
    name: Frontend Next.js — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uis/backoffice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: uis/backoffice/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build de producción
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}